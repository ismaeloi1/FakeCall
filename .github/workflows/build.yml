name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'claude/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Install Android SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --install "platforms;android-36" --channel=0 2>/dev/null || \
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --install "platforms;android-36" --channel=1 2>/dev/null || \
          echo "SDK 36 not available via stable/beta channels, continuing..."

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/build.log
          exit ${PIPESTATUS[0]}

      - name: Show Kotlin compiler errors (on failure)
        if: failure()
        run: |
          echo "=== Kotlin/Java compiler errors ==="
          grep -E "^e: |^error: |\.kt:[0-9]+:[0-9]+:" /tmp/build.log || \
            echo "(no e:/error: lines found — check full log above)"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lhuna-opus-voip-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
